# Заголовки безопасности. Подключаются и на уровне server, и в каждом location со своим add_header:
# в nginx add_header внутри location отменяет все заголовки, объявленные выше.
#
# CSP: всё своё — скрипты, стили, шрифты (лежат в сборке), запросы к API и WebSocket того же адреса.
# 'unsafe-inline' в style-src нужен для style={...} в React-компонентах; скриптов на странице нет.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
