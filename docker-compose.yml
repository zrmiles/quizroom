services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizroom
      POSTGRES_USER: quizroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizroom -d quizroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://quizroom:${POSTGRES_PASSWORD:-quizroom}@db:5432/quizroom
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
