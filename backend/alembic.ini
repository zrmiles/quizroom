# Настройки Alembic для ручных команд (новая миграция, откат):
#   uv run alembic revision --autogenerate -m "что изменилось"
#   uv run alembic upgrade head
# Адрес базы берётся из DATABASE_URL (как у приложения). Приложение само применяет
# миграции при запуске, вручную запускать upgrade обычно не нужно.

[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
